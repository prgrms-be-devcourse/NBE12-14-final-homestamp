spring:
  application:
    name: back
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:/db/migration
    default-schema: public
    schemas: public, record, state, log

# API 문서(Swagger UI)는 기본으로 끈다. local·test 프로필에서만 아래 문서가 켠다(docs/rules/04 API 문서: 운영에서 내부 API 구조 노출 방지)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # 한국 시간으로 정해진 규칙(문자 보류 21~08시, 하루 한도의 "하루")만 이 위치로 계산한다
  zone: Asia/Seoul
  link:
    # 같은 링크 열람을 한 줄로 남기는 구간(06 0-1 link.view.dedupe)
    view-dedupe: 10m
  # 한 기록에 [보충하고 다시 확인 요청]·[사진 더해서 다시 요청]·[상황이 바뀌었어요] 간격(06 0-1 rerequest.interval)
  rerequest:
    interval: 7d
  # 한 건에 진행 상황 다시 묻기 간격(누가 물었든, 06 0-1 progress.ask.interval)
  progress:
    ask:
      interval: 7d
  # 마지막 당사자 행동에서 이만큼 지나면 홈의 "오래 멈춘 건"(06 0-1 repair.stale-after, REP-6a·6e)
  repair:
    stale-after: 14d
  # 점검이 작성 중인 채로 이만큼 지나면 상대도 확인 요청을 보낼 수 있다(06 0-1 inspection.draft.stale-after)
  inspection:
    draft:
      stale-after: 7d
  # 아웃박스 문자 작업자(04 4-2). 테스트처럼 작업자를 직접 부를 때만 끈다
  outbox:
    worker:
      enabled: true
      interval-ms: 5000
      batch-size: 50
  # 06 0-1 설정값
  notice:
    send:
      retry: 1m,5m,15m
  # 거주 종료 뒤 정산 자동 마감까지(06 0-1 settlement.autoclose-after). 거주 종료 때 room_record.autoclose_due_at으로 저장한다
  settlement:
    autoclose-after: 90d
  # 기다림 기한(06 0-1). 기한은 생길 때 시각으로 저장해서 값을 바꿔도 이미 정한 기한은 그대로다
  wait:
    renotify: 48h
  delivery:
    unknown-after: 3d
    # 전달 결과 조회 일정: 보내고 첫 조회, 보내고 두 번째 조회, 그 뒤 조회 간격(06 0-1)
    poll: 1m,5m,15m
    # 전달 결과 조회 작업자(04 4-2). 기본은 꺼 둔다(실제 문자 업체 연동 전 가짜 발송기로 뜻하지 않게 돌지 않게).
    # 서비스를 열 때는 꼭 켠다(예: 환경 변수 APP_DELIVERY_POLLER_ENABLED=true). 꺼져 있으면 보낸 문자가 전달됨으로 바뀌지 않고 켜질 때 경고가 남는다
    poller:
      # 초기 제안값(#124 리뷰). 실제 업체 연동 때 업체 호출부터 DB 결과 저장까지 포함해 다시 검증한다. 실제 SMS 조회 클라이언트의 타임아웃은 이 값보다 짧아야 한다(04 4-2).
      protect-for: 2m
      enabled: false
      initial-delay-ms: 5000
      interval-ms: 30000
      batch-size: 500
  # 비밀 키(docs/rules/04 비밀값). 여기에는 값을 두지 않는다. 운영은 Parameter Store에서 받고, 값이 없으면 앱이 시작하지 않는다.
  # local·test는 아래 고정 값을 쓴다. verify-code: 인증번호 해시, verify-ticket: 인증 표 서명, phone-hmac: 번호 HMAC(번호 잠금 키)
  keys:
    verify-code:
    verify-ticket:
    phone-hmac:
    upload-ticket: # 사진 업로드 표 전용 서명 키(32바이트 이상)
    link-token: # 링크 토큰 키(32바이트 이상, 다른 키와 달라야 함). 초대 링크 토큰 = HMAC(키, 링크 ID). 열람은 저장한 토큰 해시로 찾아서 바꿔도 이미 보낸 링크는 닫히지 않고, 이전 키 없이는 기존 링크의 토큰을 다시 만들 수 없다(03 6-1 "링크 토큰", 키 버전·폐기는 #163 ③)
    # 로그인 토큰 키(32바이트 이상, 서로 달라야 함). access-token: 액세스 JWT 서명(HS256), refresh-token: 재발급한 리프레시 토큰 만들기(HMAC).
    # 둘 다 없으면 토큰 기능이 꺼지고 보호된 API는 모두 401이다. prod는 이때 시작하지 않는다
    access-token:
    refresh-token:
  # 화면의 Origin(scheme://host[:port], 끝의 /·기본 포트 없이, host는 소문자. 아니면 시작하지 않음). 쿠키로 받는 재발급 요청은 이 값과 같은 Origin만 받는다(04 4-1 재발급 요청 보호)
  origin:

# 로그인 토큰 설정값(06 0-1). 이름은 06 표와 같다
auth:
  access:
    ttl: 15m
  refresh:
    ttl: 14d
    grace: 10s

# 휴대폰 인증 설정값(06 0-1). 이름은 06 표와 같다
verify:
  code:
    ttl: 5m
  attempts:
    max: 5
  daily:
    phone: 5
  ticket:
    ttl: 15m
  resend:
    interval: 60s

# 지금 유효한 문구 판(06 0-1 terms.version.*, CONS-4). 정식 약관 전문이 준비되기 전까지는 v1, 실제 문구가 바뀌면 새 판(YYYY-MM-DD)으로 바꾼다.
# 판을 바꾸면 그 판으로 확인하지 않은 회원은 다시 확인하기 전까지 보기만 한다(03 6-2). 화면의 정적 페이지와 같은 배포에서 바꾼다
terms:
  version:
    age14: v1
    terms: v1
    privacy-notice: v1
    share-consent: v1

sms:
  daily:
    total: 40

# 대상별 사진 한도(06 0-1). 이름은 06 표와 같다. 정산 항목 한도는 그 기능을 만들 때 더한다
photo:
  max:
    repair: 30
  # 사진 주소(06 0-1 photo.url.*): 회원 썸네일은 정각부터 member, 원본은 short. 둘 다 자격 증명 만료 − 10분을 넘지 않는다
  url:
    member: 2h
    short: 5m
  s3:
    bucket: ${PHOTO_S3_BUCKET:}
    region: ${PHOTO_S3_REGION:ap-northeast-2}

# 고아 파일 확인(04 5-1, 06 0-1 orphan.check-after): 복사 전에 남긴 확인 줄이 이 시간 뒤 돈다
orphan:
  check-after: 1h

# 사진 업로드 정책 (06 0-1)
upload:
  policy:
    ttl: 5m
  ticket:
    ttl: 12h
  size:
    max: 10MB
  daily:
    member: 100
    inspection: 40

---
# prod 전용 조기 설정 공급. local·test는 이 import를 실행하지 않는다.
spring:
  config:
    activate:
      on-profile: prod
    import: "homestamp-ssm:"
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local | test
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
# local·test 전용 고정 비밀 키. prod가 함께 켜지면 쓰지 않는다(값이 없어 시작하지 않음)
spring:
  config:
    activate:
      on-profile: (local | test) & !prod
app:
  keys:
    verify-code: local-test-only-verify-code-key
    verify-ticket: local-test-only-verify-ticket-key
    phone-hmac: local-test-only-phone-hmac-key
    upload-ticket: local-test-only-photo-upload-ticket-signing-key
    link-token: local-test-only-link-token-hmac-key
    # SecurityTestSupport.loginAs가 같은 값으로 테스트 토큰을 만든다. 바꾸면 그쪽도 함께 바꾼다
    access-token: local-test-only-access-token-signing-key
    refresh-token: local-test-only-refresh-token-rotation-key
  # 문자는 보내지 않고 정해 둔 결과를 돌려준다(가짜, SmsMode). prod가 함께 켜지면 쓰지 않는다
  sms:
    mode: fake
    # 솔라피 시간 제한(NOTI-11, mode=solapi일 때만 씀). 연결 2초 안에 못 하면 보내지 않은 것(다시 시도). 응답 3초는 요청 전체 제한이라
    # 연결 시간을 포함하고, 지나면 받았는지 모르는 것(다시 보내지 않음). 그래서 인증 문자는 늦어도 3초 남짓에 끝난다(06 ACC-1j 5초 안).
    # 주소·키·발신번호는 여기 두지 않는다(prod는 아래, 키는 SSM)
    solapi:
      connect-timeout: 2s
      response-timeout: 3s
  # Vite 개발 서버
  origin: http://localhost:5173

---
# 운영 문자 방식(decisions 2026-11-25 운영 문자 모드). 솔라피 연동 전에는 disabled: 보내지 않고 실패로 남긴다(인증은 SMS_SEND_FAILED).
# 이 상태는 배포 검증용이고 실제 사용자에게 열지 않는다. solapi로 바꾸는 것은 솔라피 연동 PR과 오픈 승인 때 한다. fake는 prod에서 기동하지 않는다(SmsModeGuard)
spring:
  config:
    activate:
      on-profile: prod
app:
  sms:
    mode: disabled
    # solapi로 바꿀 때 쓰는 공식 주소(SmsModeGuard가 prod에서 이 주소만 받음). API Key·Secret·발신번호는 SSM
    # /homestamp/prod/app/app.sms.solapi.{api-key,api-secret,sender}(SecureString)에서만 읽는다
    solapi:
      base-url: https://api.solapi.com

---
# local 전용: 가짜 인증 문자의 인증번호를 로그에 남겨 화면에서 가입을 이어 간다(#248). test·prod가 함께 켜지면 남기지 않는다.
# 식은 FakeVerificationSmsSender.CODE_LOG_PROFILES와 같다(발송기가 실제 프로필을 한 번 더 본다)
spring:
  config:
    activate:
      on-profile: local & !test & !prod
app:
  sms:
    log-code: true
