# GRANT 대상 역할 이름(비밀 아님). --apply-grants만 읽는다. 환경변수·Spring 설정으로 바꿀 수 없다.
# Owner는 Migration 비밀 파일 app.migration.owner-role에서 읽는다.
# 운영 이름(decisions 2026-11-28): Owner hs_owner, Migration hs_migrator, App hs_app, Purge hs_purge, Human hs_human_read.
# Bootstrap 변수(RDS-Bootstrap-접속 7단계)·Migration 비밀 파일·App SSM 사용자 이름과 같게 둔다.
# human-role: NOLOGIN Human 읽기 그룹 하나(#185, decisions 2026-11-25). 사람별 LOGIN 역할은 그룹 멤버로 런북에서 관리한다.
app-role=hs_app
purge-role=hs_purge
human-role=hs_human_read
