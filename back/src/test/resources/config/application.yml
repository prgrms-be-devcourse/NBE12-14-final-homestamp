# 테스트 클래스패스 전용. 프로필 없이 띄우는 테스트(스키마 테스트 등)도 앱이 시작하도록 비밀 키를 넣는다.
# 운영 jar에는 들어가지 않는다. 프로필이 없을 때 키가 없으면 시작하지 않는 것은 VerificationKeysTest가 본다.
app:
  keys:
    verify-code: test-only-verify-code-key
    verify-ticket: test-only-verify-ticket-key
    phone-hmac: test-only-phone-hmac-key
    upload-ticket: test-only-photo-upload-ticket-signing-key
    link-token: test-only-link-token-hmac-key-32bytes
  # 전달 결과 작업자는 테스트에서 끈다. 다른 테스트의 통지(고정 시계의 지난 시각)를 실제 시각으로 가져가 바꾸지 않게. 작업자는 테스트가 직접 부른다
  delivery:
    poller:
      enabled: false
  # 회원 번호 HMAC 채우기(#462)는 테스트에서 끈다. 다른 테스트가 커밋한 빈 행을 바꾸거나 "채우지 않은 행" 단언과 겹치지 않게. 채우기는 테스트가 직접 부른다
  member:
    phone-hmac-fill:
      enabled: false
---
# 바뀐 약관 확인 전 막기(CONS-4)는 테스트에서 끈다. 다른 기능의 테스트가 확인 기록 없이 회원을 바로 넣고, 확인 기록은 지울 수 없어(덧붙이기만) 정리하지 못한다.
# 막기 자체는 TermsGateApiTest가 켜서 본다. prod 프로필은 끈 채로 시작하지 않으므로(TermsService) prod를 켠 테스트에는 넣지 않는다
spring:
  config:
    activate:
      on-profile: "!prod"
terms:
  gate:
    enabled: false
