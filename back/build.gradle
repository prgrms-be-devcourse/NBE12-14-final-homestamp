plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chilsuitjo'
version = '0.0.1-SNAPSHOT'
description = 'back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.57.0')
    implementation 'software.amazon.awssdk:ssm'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // 액세스 JWT 발급·검증(Nimbus, HS256). 리소스 서버 자동 설정은 쓰지 않는다. 버전은 Spring Boot가 관리한다(04 고정 버전)
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // API 문서(Swagger UI): local·test 프로필에서만 켠다(docs/rules/04 API 문서, 버전은 04 고정 버전)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // 롬복: 허용 목록과 금지는 lombok.config·docs/rules/09. 버전은 Spring Boot가 관리한다
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // 로컬 개발: bootRun이 compose.yml의 DB를 띄우고 연결 정보를 넣는다(운영 이미지·테스트에는 들어가지 않음)
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform('software.amazon.awssdk:bom:2.58.0')
    implementation 'software.amazon.awssdk:s3'
    // 사진 위치 정보(GPS 태그) 검사(04 5-1 "위치 정보 제거", Apache 2.0)
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
}

// 로컬 실행(bootRun)은 기본으로 local 프로필로 띄운다. Swagger UI가 local·test에서만 켜지기 때문(docs/rules/04 API 문서). 운영 jar에는 영향 없음
// SPRING_PROFILES_ACTIVE 환경 변수가 있으면 그 값을 쓴다(docs/setup.md 7장)
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

// 로컬 개발용 액세스 토큰: ./gradlew localAccessToken --args=<회원 UUID> (docs/setup.md 7장)
// test 소스에 있어 운영 jar에 들어가지 않고, local·test 고정 키로 서명해 운영 서버는 받지 않는다
tasks.register('localAccessToken', JavaExec) {
    group = 'application'
    description = 'local 서버에서 쓸 액세스 토큰을 만든다(--args=<회원 UUID>)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chilsuitjo.back.global.security.LocalAccessToken'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// 서식: google-java-format 버전은 팀 IntelliJ 플러그인(2.0.0.1)과 같게 고정한다(docs/rules/04 17장)
spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('2.0.0')
    }
}

// 커버리지: 도메인 입구(*Service)와 상태 전이(*Transitions)만 줄 80%·분기 70%(docs/rules/04 9-1)
jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['*Service', '*Transitions']
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
