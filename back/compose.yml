# 로컬 개발용 DB. `./gradlew bootRun`이 이 파일로 컨테이너를 띄우고 연결 정보를 자동으로 넣는다
# (spring-boot-docker-compose, developmentOnly라 운영 이미지·테스트에는 들어가지 않는다).
# 주 버전은 운영(RDS)·CI(Testcontainers)와 같은 PostgreSQL 18(docs/decisions.md).
name: homestamp

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: homestamp
      POSTGRES_USER: homestamp
      # 로컬 컨테이너 전용 값. 밖으로 나가지 않는 개발 DB라 비밀값이 아니다
      POSTGRES_PASSWORD: homestamp
    ports:
      # 호스트 포트를 고정하지 않는다(각자 PC의 5432와 부딪히지 않게). 앱은 Spring Boot가 포트를 찾아 붙는다.
      # DB 도구로 열 때는 `docker compose port postgres 5432`로 확인한다
      - "5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 폴더를 만든다
      - homestamp-db:/var/lib/postgresql

volumes:
  homestamp-db:
