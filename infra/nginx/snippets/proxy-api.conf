# /api/ → 현재 앱. 앱의 경로가 /api/...를 그대로 쓰므로 경로를 바꾸지 않는다
proxy_pass http://homestamp_app;
proxy_http_version 1.1;
proxy_set_header Connection $homestamp_connection;

# 클라이언트가 보낸 X-Forwarded-*·Forwarded는 믿지 않고 덮어쓴다(이 nginx가 맨 앞)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded "";

# 보안 헤더는 nginx가 한 번만 붙인다(location의 add_header). Spring Security 기본값과 겹치는 앱의 값은 지운다.
# HSTS도 nginx만 낸다(켜는 시점은 런북 "HSTS 켜기"가 정함)
proxy_hide_header Cache-Control;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
# 전환 뒤 확인 헤더는 nginx 값만 믿는다: 앱이 같은 이름을 보내도 지우고, 127.0.0.1 요청에만 nginx가 붙인다(nginx.conf map)
proxy_hide_header X-Homestamp-Upstream;
add_header X-Homestamp-Upstream $homestamp_upstream_probe always;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
# SSE(04 7장 이벤트)가 생기면 앱이 60초보다 짧은 간격으로 하트비트를 보내고 X-Accel-Buffering: no를 붙인다
proxy_read_timeout 60s;

# 앱이 꺼졌거나 바꾸는 중이면 JSON으로 답한다(HTML 오류 화면을 API 응답으로 주지 않음)
error_page 502 503 504 = @api_unavailable;
