# 보안 헤더 (04 3-2 "보안 헤더", 5장 CSP). render.sh가 __PHOTOS_BUCKET__을 바꿔 run/snippets/에 쓴다
# nginx는 location에 add_header가 하나라도 있으면 위쪽 add_header를 물려받지 않는다.
# 그래서 헤더를 더하는 location마다 이 파일을 다시 include한다
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header X-Frame-Options "DENY" always;

# CSP는 1~2주차 Report-Only, 3주차 강제(04 3-2). 강제로 바꿀 때 헤더 이름만 Content-Security-Policy로
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data: https://__PHOTOS_BUCKET__.s3.ap-northeast-2.amazonaws.com; connect-src 'self' https://__PHOTOS_BUCKET__.s3.ap-northeast-2.amazonaws.com; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# HSTS는 HTTPS가 실제로 잘 도는 것을 확인한 뒤 켠다(런북 "HSTS 켜기"). HSTS_MAX_AGE가 비어 있으면 render.sh가 빈 파일을 만든다
include /etc/nginx/snippets/hsts.inc;
