# HomeStamp 입구 nginx (04 3-2, 런북 docs/runbooks/HTTPS-nginx.md)
#
# - 앱 EC2에서 컨테이너로 돌고 network_mode: host라 80·443을 직접 받는다(compose.yaml)
# - 공인 입구는 이 nginx 하나다. 앱은 127.0.0.1에만 묶여 바깥에서 직접 닿지 않는다
# - 사이트 설정(conf.d/homestamp.conf)은 render.sh가 인증서가 있는지 보고 HTTP 전용 또는 HTTPS로 만든다
# - 현재 앱(blue/green)은 upstream.conf 한 줄로 가리키고 switch-upstream.sh가 바꾼다

user nginx;
worker_processes auto;
# reload 뒤 이전 작업 프로세스가 처리 중인 요청을 마칠 시간. 넘으면 닫는다(switch-upstream.sh가 이 끝을 기다린다)
worker_shutdown_timeout 30s;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  # 컨테이너가 읽기 전용이라 임시 파일은 tmpfs로
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # API 본문은 작다. 사진은 브라우저가 S3로 직접 올린다(presigned POST, 04 5장)
  client_max_body_size 1m;

  # 접속 기록에는 경로만 남긴다: 쿼리 문자열·Referer는 토큰이나 개인정보를 담을 수 있어 뺀다.
  # 링크 토큰은 주소의 # 뒤라 서버로 오지 않는다(04 "문자 링크 #").
  # 이 nginx가 맨 앞이라 $remote_addr가 실제 접속 IP다(앞에 프록시·CDN 없음)
  log_format homestamp '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log homestamp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # 현재 앱(blue 또는 green). switch-upstream.sh가 이 디렉터리의 파일을 바꾼다
  include /etc/nginx/homestamp/upstream.conf;

  # 배포 스크립트의 전환 뒤 확인용: 이 서버 자신(127.0.0.1)에서 온 요청에만 실제로 답한 앱 주소를 알려 준다.
  # 값이 비면 add_header가 헤더를 보내지 않으므로 밖의 요청에는 나가지 않는다(real_ip를 쓰지 않아 $remote_addr는 실제 연결 주소)
  map $remote_addr $homestamp_upstream_probe {
    127.0.0.1 $upstream_addr;
    default "";
  }

  # 클라이언트가 보낸 Connection 헤더를 그대로 넘기지 않는다(keepalive용)
  map $http_upgrade $homestamp_connection {
    default "";
  }

  include /etc/nginx/conf.d/*.conf;
}
