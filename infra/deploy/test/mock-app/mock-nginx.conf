worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/cb;
  proxy_temp_path /tmp/px;
  fastcgi_temp_path /tmp/fc;
  uwsgi_temp_path /tmp/uw;
  scgi_temp_path /tmp/sc;
  server {
    listen 8080;
    location = /actuator/health {
      default_type application/json;
      return __HEALTH_CODE__ '{"status":"__HEALTH_STATUS__"}';
    }
    location /api/ {
      add_header X-Mock-Version __VERSION__ always;
      return __API_CODE__ '__VERSION__';
    }
  }
}
