# dev에 머지될 때 백엔드 Gradle 캐시(배포본·의존성)를 dev 범위에 저장한다(#335).
# CI(ci.yml)는 PR에서만 돌고 GitHub 캐시는 PR끼리 나눠 쓰지 못해, 새 PR마다 "gradle cache is not found"로 처음부터 받았다.
# dev 범위에 있는 캐시는 dev를 향한 모든 PR이 읽는다. 캐시 키는 setup-java가 Gradle 파일 해시로 정하므로 ci.yml back과 같다.
name: Gradle 캐시

on:
  push:
    branches: [dev]
    paths:
      - back/build.gradle
      - back/settings.gradle
      - back/gradle/**
      - .github/workflows/gradle-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # 테스트는 돌리지 않는다. 컴파일과 서식 검사가 쓰는 의존성만 받아 캐시에 넣는다
      - name: 의존성 받기
        run: ./gradlew spotlessCheck compileTestJava --no-daemon
