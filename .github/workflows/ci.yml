# PR 검사. 기준은 docs/rules/04-인프라-아키텍처.md 9-1·10-3.
# 규칙 세트에는 맨 아래 ci-result 하나만 "통과 필수"로 건다.
# (바뀐 폴더만 도는 job은 건너뛰면 결과가 없어서, 그 job을 필수로 걸면 병합이 막힌다)
name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  # 바뀐 폴더 찾기 (외부 액션 없이 git diff로).
  # core.quotepath=off: 끄지 않으면 한글 경로가 "docs/rules/04-\354…"처럼 따옴표로 나와 ^docs/rules/에 걸리지 않는다
  changes:
    runs-on: ubuntu-24.04
    outputs:
      back: ${{ steps.diff.outputs.back }}
      back_image: ${{ steps.diff.outputs.back_image }}
      front: ${{ steps.diff.outputs.front }}
      hooks: ${{ steps.diff.outputs.hooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          files=$(git -c core.quotepath=off diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "$files"
          # 워크플로가 바뀌면 모든 job을 돌려 CI 자신을 검사한다
          all=$(echo "$files" | grep -q '^\.github/workflows/' && echo true || echo false)
          has() { [ "$all" = true ] || echo "$files" | grep -qE "$1"; }
          # CI 전용 Gradle 설정(.github/gradle/, Maven 미러)이 바뀌어도 백엔드 검사를 돌린다
          echo "back=$(has '^(back/|\.github/gradle/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 이미지 검사 스크립트(scan.sh·evaluate.sh·예외 목록)만 바뀌어도 이미지 검사를 돌린다
          echo "back_image=$(has '^(back/|\.github/gradle/|\.github/scripts/image/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "front=$(has '^front/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "hooks=$(has '^(scripts/hooks/|\.claude/|\.codex/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # 모든 PR: 브랜치·제목·릴리스·AI 서명 (값은 env로만 받아 스크립트 주입을 막는다)
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 브랜치 이름·PR 제목·릴리스 PR
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          head, base, title = os.environ["HEAD_REF"], os.environ["BASE_REF"], os.environ["PR_TITLE"]
          errors = []
          if base == "main":
              if head != "dev":
                  errors.append(f"main으로 가는 PR은 dev에서만 올 수 있어요 (지금: {head})")
          elif not re.fullmatch(r"(feat|fix|test|docs|refactor|chore)/(back|front|common)/[a-z0-9-]+", head):
              errors.append(f"브랜치 이름이 규칙과 달라요: {head} (예: feat/back/repair-register)")
          if not re.fullmatch(r"(feat|fix|test|docs|refactor|chore): .{1,50}", title):
              errors.append(f"PR 제목이 규칙과 달라요: {title} (타입: 내용, 50자 이내)")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY
      - name: AI 도구 서명 (PR 본문·커밋 메시지)
        # 제목 검사가 떨어져도 이 검사는 돌아서, 고칠 것을 한 번에 보여 준다
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          # scripts/hooks/guard-bash.mjs의 SIGNATURE_RE와 같은 규칙. 바꿀 때 두 곳을 함께 고친다.
          # AI 도구 이름이 붙은 서명만 막는다(사람끼리 남긴 Co-authored-by는 막지 않음)
          tools = "claude|anthropic|codex|openai|chatgpt|copilot|gemini"
          signature = re.compile(
              rf"co-authored-by:[^\n]*\b({tools})\b|generated\s+(with|by)\s*\[?\s*({tools})\b", re.I
          )
          found = False
          if signature.search(os.environ.get("PR_BODY") or ""):
              print("::error::PR 본문에 AI 도구 서명이 있어요. 지워 주세요")
              found = True
          # 스쿼시 병합 때 커밋 메시지가 본문으로 합쳐지므로 커밋도 본다
          log = subprocess.run(
              ["git", "log", "--format=%B", f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"],
              capture_output=True, text=True, check=True,
          ).stdout
          if signature.search(log):
              print("::error::커밋 메시지에 AI 도구 서명이 있어요. 커밋을 고쳐 주세요")
              found = True
          sys.exit(1 if found else 0)
          PY

  # 모든 PR: 규칙 문서가 바뀌면 결정 기록도 (라벨 no-decision이면 건너뜀)
  decision-record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          NO_DECISION: ${{ contains(github.event.pull_request.labels.*.name, 'no-decision') }}
        run: |
          files=$(git -c core.quotepath=off diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          if ! echo "$files" | grep -q '^docs/rules/'; then
            echo "규칙 문서(docs/rules/)가 바뀌지 않아 검사할 것이 없어요"
            exit 0
          fi
          if echo "$files" | grep -qx 'docs/decisions.md'; then
            echo "규칙 문서와 결정 기록이 함께 바뀌었어요"
            exit 0
          fi
          if [ "$NO_DECISION" = true ]; then
            echo "라벨 no-decision: 뜻이 바뀌지 않는 수정이라 결정 기록 검사를 건너뛰어요"
            exit 0
          fi
          echo "::error::docs/rules/가 바뀌었는데 docs/decisions.md에 줄이 없어요. /decide로 남기거나, 오타·문장 다듬기면 라벨 no-decision을 붙여 주세요"
          exit 1

  # 모든 PR: 비밀값 (PR 범위의 커밋만)
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 받기 (체크섬 확인)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: 비밀값 검사
        # 탐지되면 위치만 남긴다(RuleID·File·StartLine·Commit·Fingerprint). Secret·Match·소스 줄·작성자는 로그에 내지 않고,
        # 보고서 파일은 올리지 않고 끝나면 지운다. 종료 코드는 gitleaks 것을 그대로 돌려주고, 보고서를 못 읽으면 실패한다
        run: |
          report="$RUNNER_TEMP/gitleaks-report.json"
          trap 'rm -f "$report"' EXIT
          set +e
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report" .
          code=$?
          set -e
          if [ ! -s "$report" ]; then
            if [ "$code" -eq 0 ]; then
              echo "::error::gitleaks가 성공했는데 보고서가 없어요"
              exit 1
            fi
            exit "$code"
          fi
          count=$(jq -e 'if type == "array" then length else error("보고서가 배열이 아니에요") end' "$report")
          echo "탐지 건수: $count"
          jq -c '.[] | {RuleID, File, StartLine, Commit, Fingerprint}' "$report"
          exit "$code"

  back:
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-24.04
    # 정상은 job 전체 3~5분(2026-11-28 성공 실행 2분 45초~4분 49초). 끝나지 않는 job이 기본 360분까지 러너를 잡지 않게(#476)
    # 정상의 6배쯤인 30분에서 끊는다
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # 캐시에 없는 의존성은 Maven Central 대신 미러에서 받는다(러너 공유 IP의 429 막기, #372)
      - name: CI Maven 미러
        run: mkdir -p ~/.gradle/init.d && cp ../.github/gradle/ci-mirror.init.gradle ~/.gradle/init.d/
      # 메모리 부족을 볼 때 러너 크기를 추정하지 않으려고 남긴다(#476)
      - name: 러너 자원
        run: nproc && free -m
      # Gradle을 한 번만 띄운다(따로 돌리면 JVM·설정 읽기를 두 번 함, #335)
      # Migration 통합 테스트는 back-migration이 따로 돌린다
      - name: 서식·테스트·커버리지 (Spotless, Testcontainers postgres:18.6, JaCoCo)
        run: ./gradlew spotlessCheck build --no-daemon -PexcludeTests=com.chilsuitjo.back.MigrationRunnerIntegrationTest
      - name: 커버리지 보고서
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: back/build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7

  # 이미지 빌드·검사는 Dockerfile 안에서 따로 컴파일하는 multi-stage라 back과 동시에 돌린다(#335).
  # 필수 검사는 ci-result 하나라 PR의 이미지 빌드·Trivy 검사는 여기 한 곳에서만 한다(image-publish는 main·수동만, #350).
  # Docker 안의 Gradle은 CI Maven 미러(.github/gradle/ci-mirror.init.gradle)에서 받아 Maven Central 429를 피한다(#372)
  back-image:
    needs: changes
    if: needs.changes.outputs.back_image == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Docker 안의 Gradle도 미러에서 받게, 미러 설정만 담은 Gradle 홈을 넘긴다(수 KB, #372).
      # 캐시를 통째로 넘기면 수백 MB를 옮기느라 오히려 느리다
      - name: 백엔드 Docker 이미지 빌드 (linux/amd64)
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home/init.d"
          cp .github/gradle/ci-mirror.init.gradle "$RUNNER_TEMP/gradle-home/init.d/"
          docker build --platform linux/amd64 \
            --build-context gradle-home="$RUNNER_TEMP/gradle-home" \
            --tag homestamp-back:candidate --file back/Dockerfile back
      # 검사 실패(취약점 DB를 못 받음·새 취약점)는 PR을 막지 않는다(런북 이미지-발행.md "PR에서", 예전 image-publish와 같음).
      # 결과는 아래 artifact와 이 단계의 실패 표시로 본다. 이미지 빌드 실패는 위 단계에서 막는다
      - name: 보안 검사 (Trivy, 막지 않음)
        continue-on-error: true
        run: .github/scripts/image/scan.sh homestamp-back:candidate trivy-report
      - name: 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report/
          if-no-files-found: warn
          retention-days: 30

  # 운영 jar를 JRE 컨테이너에서 실제로 실행해 보는 Migration 통합 테스트는 혼자 테스트 시간의 약 40%(CI 77초, #348)라
  # back과 동시에 돌린다(#350). 커버리지 대상(*Service·*Transitions)이 아니라 back의 커버리지 검사와 상관없다
  back-migration:
    needs: changes
    if: needs.changes.outputs.back == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: CI Maven 미러
        run: mkdir -p ~/.gradle/init.d && cp ../.github/gradle/ci-mirror.init.gradle ~/.gradle/init.d/
      - name: Migration 통합 테스트 (MigrationRunnerIntegrationTest)
        run: ./gradlew test --tests com.chilsuitjo.back.MigrationRunnerIntegrationTest --no-daemon

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # 훅에는 Windows 전용 분기(PowerShell 경로, gradlew.bat)가 있고 팀의 절반이 Windows라 두 운영체제에서 돌린다
  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test scripts/hooks/hooks.test.mjs

  # 승인 해시: deploy.tf의 승인 해시가 Git의 배포 스크립트와 같은지. 몇 초라 경로와 상관없이 언제나 돈다
  # (스크립트만, 해시만, 검사 자체만 바뀐 PR도 같은 검사를 받는다. 배포-자동화 "코드 배포")
  deploy-hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 검사 시험(가짜 저장소)
        run: bash .github/scripts/test/check-deploy-hash-test.sh
      - name: 승인 해시 = Git 원본
        run: bash .github/scripts/check-deploy-hash.sh

  # 규칙 세트의 "통과 필수"는 이것 하나. 건너뛴 job(skipped)은 통과로 보되, 언제나 도는 job(ALWAYS)은 success만 통과
  ci-result:
    if: always()
    needs: [changes, conventions, decision-record, gitleaks, back, back-image, back-migration, front, hooks, deploy-hash]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          ALWAYS = {"deploy-hash"}
          bad = [name for name in ALWAYS if name not in needs]
          for name, need in needs.items():
              result = need["result"]
              print(f"{name}: {result}")
              allowed = ("success",) if name in ALWAYS else ("success", "skipped")
              if result not in allowed:
                  bad.append(name)
          if bad:
              print("::error::실패한 검사: " + ", ".join(bad))
              sys.exit(1)
          PY
