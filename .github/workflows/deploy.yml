# 운영 배포(04 9-2, 런북 docs/runbooks/배포-자동화.md). PR에서는 돌지 않는다(PR 검증은 deploy-check.yml).
#
# 이미지 digest를 손으로 넣어 시작하고, Environment production의 승인을 받은 뒤에만 AWS에 닿는다.
#   1 preflight: main인지, digest 형식, Environment가 있고 승인자·배포 브랜치 규칙이 걸려 있는지(없으면 여기서 멈춤.
#                없는 Environment를 job이 가리키면 GitHub가 보호 규칙 없이 만들어 버리기 때문)
#   2 deploy   : 승인 → OIDC(장기 키 없음) → 이미지 확인(digest·linux/amd64) → homestamp-deploy 문서 → 결과 코드
# 동시에 하나만(concurrency, 진행 중인 배포는 취소하지 않음). 서버도 flock으로 한 번 더 막는다.
# 워크플로를 취소해도 서버의 deploy.sh는 끝까지 돌아 정해진 상태로 끝난다(취소 권한을 주지 않음).
name: deploy

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "배포할 앱 이미지 digest (sha256:<64자>)"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 입력과 Environment 보호 규칙 확인
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest 형식이 아닙니다"; exit 1; }
          env_json="$(gh api "repos/$REPO/environments/production")" || { echo "::error::Environment production이 없습니다(런북 '처음 설정')"; exit 1; }
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' <<<"$env_json" >/dev/null \
            || { echo "::error::production에 승인자(required reviewers)가 없습니다"; exit 1; }
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$env_json" >/dev/null \
            || { echo "::error::production에 배포 브랜치 규칙(선택한 브랜치: main)이 없습니다"; exit 1; }
          branches="$(gh api "repos/$REPO/environments/production/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")')"
          [[ "$branches" == "branch:main" ]] || { echo "::error::production 배포 브랜치는 main 하나여야 합니다($branches)"; exit 1; }

  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 결과 기다림 2700초(문서 실행 2400 + 전달 60 + 여유) + 앞 단계. OIDC 세션(3600초) 안에서 끝난다
    timeout-minutes: 50
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 배포 설정 확인
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || { echo "::error::Environment 변수 IMAGE_REPOSITORY가 없거나 형식이 아닙니다"; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "::error::Environment 변수 EC2_INSTANCE_ID가 없거나 형식이 아닙니다"; exit 1; }

      # 공개 GHCR 패키지라 자격 증명 없이 읽는다(04 9-3). digest가 있고 linux/amd64(t3)인지
      - name: 이미지 확인
        env:
          IMAGE: ${{ vars.IMAGE_REPOSITORY }}@${{ inputs.digest }}
        run: |
          platforms="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
            | jq -r 'if .manifests then [.manifests[].platform | "\(.os)/\(.architecture)"] | join(" ") else "single" end')" \
            || { echo "::error::이미지를 찾지 못했습니다"; exit 1; }
          if [[ "$platforms" == single ]]; then
            platforms="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' | jq -r '"\(.os)/\(.architecture)"')"
          fi
          echo "platforms: $platforms"
          [[ " $platforms " == *" linux/amd64 "* ]] || { echo "::error::linux/amd64 이미지가 아닙니다"; exit 1; }

      - name: AWS 임시 자격 증명(OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/homestamp-deploy
          role-session-name: homestamp-deploy-${{ github.run_id }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true
          role-duration-seconds: 3600

      - name: 배포(SSM → deploy.sh)
        env:
          DIGEST: ${{ inputs.digest }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCUMENT_NAME: homestamp-deploy
          AWS_REGION: ap-northeast-2
        run: .github/scripts/ssm-deploy.sh
